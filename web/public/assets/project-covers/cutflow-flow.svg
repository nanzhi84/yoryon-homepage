<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CutFlow 数字人短视频生产系统结构图</title>
  <desc id="desc">Case 作为长期边界，Temporal 编排 19 到 20 个生产节点，ProviderGateway、数据与媒体底座支撑生产，再将发布和效果数据回流到 Case。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3158a8"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a732b"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .eyebrow { font-size: 17px; letter-spacing: 2.5px; fill: #3158a8; }
      .title { font-size: 48px; font-weight: 650; fill: #22211e; }
      .subtitle { font-size: 20px; fill: #6f6b63; }
      .step { font-size: 14px; letter-spacing: 1.3px; fill: #3158a8; }
      .box-title { font-size: 22px; font-weight: 650; fill: #22211e; }
      .box-copy { font-size: 15px; fill: #5e5a53; }
      .node-title { font-size: 17px; font-weight: 650; fill: #282622; }
      .node-copy { font-size: 13.5px; fill: #68645d; }
      .support-title { font-size: 18px; font-weight: 650; fill: #272521; }
      .support-copy { font-size: 14px; fill: #67635c; }
      .line { fill: none; stroke: #3158a8; stroke-width: 3; marker-end: url(#arrow); }
      .line-gold { fill: none; stroke: #9a732b; stroke-width: 2.5; marker-end: url(#arrow-gold); }
      .line-dashed { fill: none; stroke: #3158a8; stroke-width: 2.5; stroke-dasharray: 9 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#faf9f6"/>
  <text x="78" y="74" class="mono eyebrow">CASE-FIRST CONTENT OPERATING SYSTEM</text>
  <text x="78" y="139" class="sans title">CutFlow 数字人短视频生产系统</text>
  <text x="78" y="181" class="sans subtitle">长期账号边界、AI 能力、确定性媒体节点、成本与发布数据，共同组成一条可审计的生产闭环</text>

  <g>
    <rect x="72" y="257" width="235" height="306" rx="24" fill="#303d5f" stroke="#303d5f"/>
    <text x="98" y="297" class="mono" font-size="12" letter-spacing="1.1" fill="#becbf0">01 / LONG-TERM BOUNDARY</text>
    <text x="98" y="343" class="sans" font-size="27" font-weight="650" fill="#ffffff">CASE 工作台</text>
    <text x="98" y="388" class="sans" font-size="16" fill="#e2e7f3">账号定位 / 品牌边界</text>
    <text x="98" y="425" class="sans" font-size="16" fill="#e2e7f3">受众 / 策略 / 素材</text>
    <text x="98" y="462" class="sans" font-size="16" fill="#e2e7f3">脚本 / 指标 / 学习反馈</text>
    <rect x="98" y="496" width="181" height="42" rx="11" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="188" y="523" text-anchor="middle" class="mono" font-size="13" fill="#ffffff">one account = one memory</text>
  </g>

  <path d="M 309 410 H 355" class="line"/>

  <g>
    <rect x="357" y="257" width="236" height="306" rx="24" fill="#eee8dc" stroke="#b99653" stroke-width="2"/>
    <text x="383" y="297" class="mono" font-size="14" letter-spacing="1.4" fill="#8c6825">02 / ORCHESTRATION</text>
    <text x="383" y="343" class="sans" font-size="20" font-weight="650" fill="#22211e">Temporal WorkflowRun</text>
    <text x="383" y="389" class="sans box-copy">API 负责准入与控制</text>
    <text x="383" y="425" class="sans box-copy">Worker 执行长流程</text>
    <text x="383" y="461" class="sans box-copy">重试 / 取消 / 恢复</text>
    <rect x="383" y="493" width="184" height="45" rx="11" fill="#9a732b"/>
    <text x="475" y="521" text-anchor="middle" class="sans" font-size="15" font-weight="650" fill="#ffffff">主链 19 · Agent 链 20</text>
  </g>

  <path d="M 595 410 H 633" class="line"/>

  <g>
    <rect x="635" y="229" width="892" height="362" rx="28" fill="#ffffff" stroke="#d6d1c6" stroke-width="2"/>
    <text x="665" y="270" class="mono step">03 / AUDITABLE PRODUCTION PIPELINE</text>

    <g>
      <rect x="667" y="306" width="150" height="206" rx="18" fill="#f4f2ec" stroke="#ded9cf"/>
      <text x="742" y="342" text-anchor="middle" class="mono" font-size="13" fill="#3158a8">A</text>
      <text x="742" y="376" text-anchor="middle" class="sans node-title">上下文与脚本</text>
      <text x="742" y="411" text-anchor="middle" class="sans node-copy">校验 / Case 加载</text>
      <text x="742" y="439" text-anchor="middle" class="sans node-copy">意图解析 / 脚本版本</text>
      <text x="742" y="467" text-anchor="middle" class="sans node-copy">Prompt binding</text>
    </g>
    <path d="M 819 409 H 847" class="line-gold"/>

    <g>
      <rect x="849" y="306" width="150" height="206" rx="18" fill="#f4f2ec" stroke="#ded9cf"/>
      <text x="924" y="342" text-anchor="middle" class="mono" font-size="13" fill="#3158a8">B</text>
      <text x="924" y="376" text-anchor="middle" class="sans node-title">声音与对齐</text>
      <text x="924" y="411" text-anchor="middle" class="sans node-copy">TTS / ASR</text>
      <text x="924" y="439" text-anchor="middle" class="sans node-copy">旁白时间轴</text>
      <text x="924" y="467" text-anchor="middle" class="sans node-copy">强制对齐</text>
    </g>
    <path d="M 1001 409 H 1029" class="line-gold"/>

    <g>
      <rect x="1031" y="306" width="150" height="206" rx="18" fill="#eee8dc" stroke="#c9ac74"/>
      <text x="1106" y="342" text-anchor="middle" class="mono" font-size="13" fill="#8c6825">C</text>
      <text x="1106" y="376" text-anchor="middle" class="sans node-title">素材与数字人</text>
      <text x="1106" y="411" text-anchor="middle" class="sans node-copy">人像 / B-roll / BGM</text>
      <text x="1106" y="439" text-anchor="middle" class="sans node-copy">语义选择 / LipSync</text>
      <text x="1106" y="467" text-anchor="middle" class="sans node-copy">复用与去重</text>
    </g>
    <path d="M 1183 409 H 1211" class="line-gold"/>

    <g>
      <rect x="1213" y="306" width="150" height="206" rx="18" fill="#f4f2ec" stroke="#ded9cf"/>
      <text x="1288" y="342" text-anchor="middle" class="mono" font-size="13" fill="#3158a8">D</text>
      <text x="1288" y="376" text-anchor="middle" class="sans node-title">渲染与质检</text>
      <text x="1288" y="411" text-anchor="middle" class="sans node-copy">时间线 / FFmpeg</text>
      <text x="1288" y="439" text-anchor="middle" class="sans node-copy">字幕带 / BGM 混音</text>
      <text x="1288" y="467" text-anchor="middle" class="sans node-copy">成片验证</text>
    </g>
    <path d="M 1365 409 H 1393" class="line-gold"/>

    <g>
      <rect x="1395" y="306" width="100" height="206" rx="18" fill="#e8edf8" stroke="#9dafdc"/>
      <text x="1445" y="342" text-anchor="middle" class="mono" font-size="13" fill="#3158a8">E</text>
      <text x="1445" y="376" text-anchor="middle" class="sans node-title">发布</text>
      <text x="1445" y="411" text-anchor="middle" class="sans node-copy">封面</text>
      <text x="1445" y="439" text-anchor="middle" class="sans node-copy">文案</text>
      <text x="1445" y="467" text-anchor="middle" class="sans node-copy">发布包</text>
    </g>

    <text x="1081" y="552" text-anchor="middle" class="mono" font-size="13.5" fill="#77736b">typed artifacts · node reports · idempotency · explicit degradation events</text>
  </g>

  <rect x="72" y="644" width="1455" height="166" rx="26" fill="#f4f2ec" stroke="#d6d1c6" stroke-width="2"/>
  <text x="100" y="679" class="mono step">SHARED GOVERNANCE &amp; INFRASTRUCTURE</text>

  <g>
    <rect x="104" y="703" width="275" height="78" rx="15" fill="#ffffff" stroke="#d9d4ca"/>
    <text x="241" y="733" text-anchor="middle" class="sans support-title">ProviderGateway</text>
    <text x="241" y="754" text-anchor="middle" class="sans support-copy">LLM · VLM · TTS · ASR</text>
    <text x="241" y="773" text-anchor="middle" class="sans support-copy">LipSync · Image · Video</text>
  </g>
  <g>
    <rect x="401" y="703" width="264" height="78" rx="15" fill="#ffffff" stroke="#d9d4ca"/>
    <text x="533" y="733" text-anchor="middle" class="sans support-title">Prompt &amp; Secret Governance</text>
    <text x="533" y="760" text-anchor="middle" class="sans support-copy">版本 / Binding / Profile / SecretStore</text>
  </g>
  <g>
    <rect x="687" y="703" width="250" height="78" rx="15" fill="#ffffff" stroke="#d9d4ca"/>
    <text x="812" y="733" text-anchor="middle" class="sans support-title">Data &amp; Media</text>
    <text x="812" y="760" text-anchor="middle" class="sans support-copy">PostgreSQL · Object Store · FFmpeg</text>
  </g>
  <g>
    <rect x="959" y="703" width="246" height="78" rx="15" fill="#ffffff" stroke="#d9d4ca"/>
    <text x="1082" y="733" text-anchor="middle" class="sans support-title">Ops &amp; Economics</text>
    <text x="1082" y="760" text-anchor="middle" class="sans support-copy">11 项成本 · 11 项成品率 · 预算熔断</text>
  </g>
  <g>
    <rect x="1227" y="703" width="268" height="78" rx="15" fill="#e8edf8" stroke="#9dafdc"/>
    <text x="1361" y="733" text-anchor="middle" class="sans support-title">Publish Data → Review</text>
    <text x="1361" y="760" text-anchor="middle" class="sans support-copy">效果回流 · 评分卡 · 下一轮学习</text>
  </g>

  <path d="M 1445 513 V 617 Q 1445 624 1438 624 H 221 Q 190 624 190 593 V 566" class="line-dashed"/>
  <text x="769" y="618" text-anchor="middle" class="mono" font-size="14" fill="#3158a8">PUBLISH → METRICS → SCORECARD → CASE MEMORY</text>
</svg>
